name: GARUDA SEMESTA — Hardware & Compiler Regression CI/CD V2.4.1

on:
  push:
    branches: [ main, engineering/hardening-v2, engineering/hardening-v2.3, engineering/hardening-v2.3.2, engineering/v2.4.1-real-rtl-docker ]
  pull_request:
    branches: [ main, engineering/hardening-v2.3.2, engineering/v2.4.1-real-rtl-docker ]

jobs:
  verify_hardware_and_compiler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Icarus Verilog & GTKWave EDA Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog gtkwave

      - name: Verify EDA Tool Versions
        run: |
          iverilog -V || true
          vvp -V || true
          python src/verification/garuda_tool_detector.py

      - name: Compile GARUDA Program via garuda_compiler.py
        run: |
          python garuda_compiler.py

      - name: Compile Verilog RTL via Icarus Verilog (iverilog)
        run: |
          mkdir -p build
          iverilog -g2012 -Wall -s tb_garuda_vertical_slice_v23_2 -o build/garuda_vertical_slice.vvp \
            src/memory/garuda_l1_icache.v \
            src/memory/garuda_l1_dcache.v \
            src/memory/garuda_l2_cache.v \
            src/memory/garuda_memory_arbiter.v \
            src/memory/garuda_memory_controller.v \
            src/memory/garuda_memory_subsystem_top.v \
            src/cpu/garuda_pc.v \
            src/cpu/garuda_idecode.v \
            src/cpu/garuda_regfile.v \
            src/cpu/garuda_alu.v \
            src/cpu/garuda_cpu_pipeline_top.v \
            src/integration/garuda_vertical_slice_top.v \
            src/integration/tb_garuda_vertical_slice_v23_2.v

      - name: Execute RTL Simulation via VVP
        run: |
          vvp build/garuda_vertical_slice.vvp

      - name: Run Master Unit & Integration Test Suite
        run: |
          python tests/run_all_unit_and_integration_tests.py

      - name: Run Live Compiler-to-Silicon Vertical Slice Test
        run: |
          python src/integration/garuda_compiler_vertical_slice_v23.py

      - name: Generate Machine-Readable JSON Reports
        run: |
          python src/verification/generate_v231_reports.py

      - name: Upload Simulation Artifacts & VCD Waveform
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: garuda-v241-rtl-verification-artifacts
          path: |
            build/garuda_vertical_slice.vvp
            reports/
            artifacts/
            *.vcd
